<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>แอดมินแบบทดสอบ Pre/Post</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--navy:#0f2744;--blue:#1d5fa8;--bg:#f3f6f8;--line:#dde3ea;--green:#1a7a4a;--red:#b03030;--amber:#9c6200;--muted:#627587}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#1e2533;font-family:'Sarabun',sans-serif;font-size:15px;line-height:1.5}
header{background:var(--navy);color:#fff;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px}
header h1{margin:0;font-size:16px}
header .r{display:flex;gap:8px;align-items:center;font-size:13px}
main{max-width:1100px;margin:0 auto;padding:18px 16px 60px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
h2{margin:0 0 10px;font-size:18px;color:var(--navy)}
h3{margin:0 0 8px;font-size:15px;color:var(--navy)}
.muted{color:var(--muted);font-size:13px}
.btn{border:none;border-radius:8px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer;background:var(--blue);color:#fff}
.btn:hover{filter:brightness(.92)} .btn:disabled{background:#b8c4d0;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}
.btn.red{background:#fdeeea;color:var(--red);border:1px solid #f3c7cf}
.btn.green{background:var(--green)}
.btn.sm{padding:4px 10px;font-size:13px}
input[type=text],input[type=password],input[type=number],textarea,select{width:100%;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;font:inherit;background:#fff}
input:focus,textarea:focus{outline:none;border-color:var(--blue)}
label.f{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;gap:4px;margin-bottom:14px;flex-wrap:wrap}
.tab{padding:9px 16px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:600;color:var(--muted)}
.tab.on{background:var(--blue);border-color:var(--blue);color:#fff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
.stat{background:#f7fafc;border:1px solid var(--line);border-radius:10px;padding:12px}
.stat .n{font-size:26px;font-weight:700;color:var(--navy);line-height:1.2}
.stat .l{font-size:12px;color:var(--muted)}
.stat.click{cursor:pointer;border-color:#9fc6e0}
.stat.click:hover{background:#eef6fc}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:var(--navy);color:#fff;padding:8px 10px;text-align:left;white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid #eef1f4;vertical-align:middle}
.tag{font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap;display:inline-block}
.tag.ok{background:#e3f7ee;color:#178a5c} .tag.no{background:#fdeeea;color:var(--red)} .tag.wait{background:#fff2d8;color:var(--amber)} .tag.gray{background:#eef0f4;color:var(--muted)}
.q{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:#fff}
.q .opts div{padding:1px 0;font-size:14px}
.q .opts .c{color:var(--green);font-weight:700}
.err{background:#fdeeea;color:var(--red);border:1px solid #f3c7cf;border-radius:8px;padding:10px;margin:10px 0}
.warn{background:#fff6e0;color:var(--amber);border:1px solid #f0dca8;border-radius:8px;padding:10px;margin:10px 0}
.modal{position:fixed;inset:0;background:rgba(10,20,40,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal .box{background:#fff;border-radius:12px;max-width:760px;width:100%;max-height:88vh;overflow:auto;padding:18px}
.res{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid #eef1f4}
.res .mark{font-weight:700;flex:0 0 22px}
.res.c .mark{color:var(--green)} .res.w .mark{color:var(--red)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1f2937;color:#fff;padding:10px 20px;border-radius:8px;z-index:99;font-weight:600}
.linkbox{background:#f0f4f8;border:1px dashed #9fb4c8;border-radius:8px;padding:10px;word-break:break-all;font-size:13px}
@media(max-width:700px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>📝 แอดมินแบบทดสอบ Pre/Post</h1><div class="r" id="hRight"></div></header>
<main id="app"><div class="card muted">กำลังโหลด...</div></main>

<script>
/* ===== Supabase ===== */
const SUPABASE_URL = 'https://dcaydbxyjisegqzzildq.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRjYXlkYnh5amlzZWdxenppbGRxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ2OTk5NDgsImV4cCI6MjEwMDI3NTk0OH0.cEk8k90NeTTnkZV0Sny7nuN8UbW15_eW8S_HTQSBwwA';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const LETTERS = ['ก','ข','ค','ง','จ'];
const MAX_Q = 20;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtT = t => t ? new Date(t).toLocaleString('th-TH', { dateStyle: 'short', timeStyle: 'short' }) : '';
function toast(m){ const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }

/* ===== state ===== */
let user = null, sessions = [], cur = null;
let questions = [], keys = {}, people = [], attempts = [];
let tab = 'dash', dashKind = 'pre', openPending = false, openFail = false;
let editingQ = null;   // null | 'new' | question id
let channel = null, pollTimer = null, rtStatus = '', reloadTimer = null;

/* ===== boot / login ===== */
async function boot(){
  const { data: { session } } = await sb.auth.getSession();
  if(session) await afterLogin(session.user); else viewLogin();
}
function viewLogin(msg){
  $('hRight').innerHTML = '';
  $('app').innerHTML = `<div class="card" style="max-width:420px;margin:40px auto">
    <h2>เข้าสู่ระบบแอดมิน</h2>
    <label class="f">อีเมล หรือ รหัสพนักงาน</label><input type="text" id="lu" autocomplete="username">
    <label class="f">รหัสผ่าน</label><input type="password" id="lp" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    ${msg ? `<div class="err">${esc(msg)}</div>` : ''}
    <button class="btn" style="width:100%;margin-top:14px" onclick="doLogin()">เข้าสู่ระบบ</button>
    <p class="muted">ใช้บัญชีเดียวกับระบบ TRAINFIN (พิมพ์รหัสพนักงานได้เลย)</p></div>`;
}
async function doLogin(){
  let u = $('lu').value.trim(); const p = $('lp').value;
  if(!u || !p) return;
  if(!u.includes('@')) u += '@trainfin.local';
  const { data, error } = await sb.auth.signInWithPassword({ email: u, password: p });
  if(error){ viewLogin('เข้าสู่ระบบไม่สำเร็จ: ' + error.message); return; }
  await afterLogin(data.user);
}
async function afterLogin(u){
  const { data } = await sb.from('exam_admins').select('user_id').eq('user_id', u.id).maybeSingle();
  if(!data){ await sb.auth.signOut(); viewLogin('บัญชีนี้ไม่มีสิทธิ์แอดมินแบบทดสอบ (ยังไม่ได้เพิ่มใน exam_admins)'); return; }
  user = u;
  $('hRight').innerHTML = `<span>${esc(u.email)}</span><button class="btn ghost sm" style="background:transparent;color:#fff;border-color:#fff" onclick="doLogout()">ออกจากระบบ</button>`;
  viewSessions();
}
async function doLogout(){ leaveSession(); await sb.auth.signOut(); user = null; viewLogin(); }

/* ===== รายการการสอบ ===== */
async function viewSessions(){
  leaveSession();
  $('app').innerHTML = '<div class="card muted">กำลังโหลด...</div>';
  const { data, error } = await sb.from('exam_sessions').select('*').order('created_at', { ascending: false });
  if(error){ $('app').innerHTML = `<div class="err">${esc(error.message)}</div>`; return; }
  sessions = data || [];
  $('app').innerHTML = `<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">แบบทดสอบทั้งหมด</h2>
      <button class="btn" onclick="viewNewSession()">＋ สร้างแบบทดสอบใหม่</button></div>
    ${sessions.length ? `<table style="margin-top:12px"><thead><tr><th>หลักสูตร</th><th>เลขที่</th><th>รุ่น</th><th>สร้างเมื่อ</th><th></th></tr></thead><tbody>` +
      sessions.map(s => `<tr><td><b>${esc(s.title)}</b></td><td>${esc(s.course_no)}</td><td>${esc(s.batch)}</td><td>${fmtT(s.created_at)}</td>
        <td><button class="btn sm" onclick="openSession('${s.id}')">เปิด</button></td></tr>`).join('') + '</tbody></table>'
      : '<p class="muted">ยังไม่มีแบบทดสอบ กด "สร้างแบบทดสอบใหม่"</p>'}</div>`;
}
function viewNewSession(){
  $('app').innerHTML = `<div class="card" style="max-width:640px"><h2>สร้างแบบทดสอบใหม่</h2>
    <label class="f">ชื่อหลักสูตร *</label><input type="text" id="n_title">
    <div class="grid2"><div><label class="f">เลขที่หลักสูตร</label><input type="text" id="n_no"></div>
    <div><label class="f">รุ่น</label><input type="text" id="n_batch"></div>
    <div><label class="f">เกณฑ์ผ่าน (%)</label><input type="number" id="n_pass" value="80" min="1" max="100"></div></div>
    <div class="row" style="margin-top:12px"><label><input type="checkbox" id="n_sq"> สลับลำดับข้อ</label><label><input type="checkbox" id="n_so"> สลับตัวเลือก</label></div>
    <div class="row" style="margin-top:16px"><button class="btn green" onclick="createSession()">สร้าง</button><button class="btn ghost" onclick="viewSessions()">ยกเลิก</button></div></div>`;
}
async function createSession(){
  const title = $('n_title').value.trim();
  if(!title){ toast('กรุณาใส่ชื่อหลักสูตร'); return; }
  const row = { title, course_no: $('n_no').value.trim(), batch: $('n_batch').value.trim(),
    pass_percent: Math.min(100, Math.max(1, parseInt($('n_pass').value) || 80)),
    shuffle_questions: $('n_sq').checked, shuffle_options: $('n_so').checked };
  const { data, error } = await sb.from('exam_sessions').insert(row).select().single();
  if(error){ toast('ผิดพลาด: ' + error.message); return; }
  await openSession(data.id, 'q');
}

/* ===== เปิดการสอบ + โหลดข้อมูล ===== */
async function openSession(id, startTab){
  leaveSession();
  tab = startTab || 'dash'; dashKind = 'pre'; openPending = openFail = false; editingQ = null;
  $('app').innerHTML = '<div class="card muted">กำลังโหลด...</div>';
  const { data, error } = await sb.from('exam_sessions').select('*').eq('id', id).single();
  if(error){ $('app').innerHTML = `<div class="err">${esc(error.message)}</div>`; return; }
  cur = data;
  await loadAll();
  subscribe();
  renderDetail();
}
async function loadAll(){
  const id = cur.id;
  const [qs, pp, at] = await Promise.all([
    sb.from('exam_questions').select('*').eq('session_id', id).order('position'),
    sb.from('exam_participants').select('*').eq('session_id', id).order('full_name'),
    sb.from('exam_attempts').select('*').eq('session_id', id).range(0, 9999),
  ]);
  questions = qs.data || [];
  people = (pp.data || []).slice().sort((a, b) => String(a.emp_id).localeCompare(String(b.emp_id), 'th', { numeric: true }));   // เรียงตามรหัสพนักงาน
  attempts = at.data || [];
  keys = {};
  if(questions.length){
    const { data: ks } = await sb.from('exam_answer_keys').select('*').in('question_id', questions.map(q => q.id));
    (ks || []).forEach(k => { keys[k.question_id] = k.correct_index; });
  }
  const { data: s } = await sb.from('exam_sessions').select('*').eq('id', id).single();
  if(s) cur = s;
}
function subscribe(){
  channel = sb.channel('exam-' + cur.id)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'exam_attempts', filter: 'session_id=eq.' + cur.id }, scheduleReload)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'exam_participants', filter: 'session_id=eq.' + cur.id }, scheduleReload)
    .subscribe(st => { rtStatus = st === 'SUBSCRIBED' ? '🟢 Real time เชื่อมต่อแล้ว' : '🟡 กำลังเชื่อมต่อ Real time...'; const el = $('rt'); if(el) el.textContent = rtStatus; });
  pollTimer = setInterval(() => { if(tab === 'dash' && !document.hidden) scheduleReload(); }, 20000);   // สำรองเผื่อ Realtime หลุด
}
function scheduleReload(){
  clearTimeout(reloadTimer);
  reloadTimer = setTimeout(async () => { if(!cur) return; await loadAll(); if(tab === 'dash' || tab === 'people') renderTab(); }, 300);
}
function leaveSession(){
  if(channel){ sb.removeChannel(channel); channel = null; }
  clearInterval(pollTimer); clearTimeout(reloadTimer); cur = null;
}

/* ===== โครงหน้ารายละเอียด ===== */
function renderDetail(){
  $('app').innerHTML = `<div class="row" style="justify-content:space-between;margin-bottom:10px">
      <div><button class="btn ghost sm" onclick="viewSessions()">← กลับรายการ</button>
      <h2 style="display:inline;margin-left:10px">${esc(cur.title)}</h2>
      <span class="muted"> ${cur.batch ? 'รุ่น ' + esc(cur.batch) : ''} ${cur.course_no ? '· เลขที่ ' + esc(cur.course_no) : ''}</span></div>
      <span class="muted" id="rt">${esc(rtStatus)}</span></div>
    <div class="tabs">${[['dash','📊 แดชบอร์ด'],['q','❓ ข้อสอบ'],['people','👥 รายชื่อ'],['set','⚙️ ตั้งค่า/ลิงก์']].map(([k, l]) =>
      `<div class="tab ${tab === k ? 'on' : ''}" onclick="setTab('${k}')">${l}</div>`).join('')}</div>
    <div id="tabBody"></div>`;
  renderTab();
}
function setTab(t){ tab = t; editingQ = null; renderDetail(); }
function renderTab(){
  const el = $('tabBody'); if(!el) return;
  if(tab === 'dash') el.innerHTML = dashHtml();
  else if(tab === 'q') el.innerHTML = questionsHtml();
  else if(tab === 'people') el.innerHTML = peopleHtml();
  else el.innerHTML = settingsHtml();
}

/* ===== แดชบอร์ด ===== */
function currentAttempt(pid, kind){ return attempts.find(a => a.participant_id === pid && a.kind === kind && !a.unlocked) || null; }
function lastUnlocked(pid, kind){
  const l = attempts.filter(a => a.participant_id === pid && a.kind === kind && a.unlocked).sort((a, b) => b.submitted_at.localeCompare(a.submitted_at));
  return l[0] || null;
}
function attemptCount(pid, kind){ return attempts.filter(a => a.participant_id === pid && a.kind === kind).length; }
function scoreCell(pid, kind){
  const a = currentAttempt(pid, kind);
  if(a){
    const badge = kind === 'post' ? (a.passed ? ' <span class="tag ok">ผ่าน</span>' : ' <span class="tag no">ไม่ผ่าน</span>') : '';
    return `${a.score}/${a.total}${badge}`;
  }
  const u = lastUnlocked(pid, kind);
  return u ? `<span class="tag wait">ปลดล็อกแล้ว (เดิม ${u.score}/${u.total})</span>` : '<span class="muted">—</span>';
}
function dashHtml(){
  if(!people.length) return '<div class="card"><p class="muted">ยังไม่มีรายชื่อผู้เข้าอบรม ไปที่แท็บ "รายชื่อ" เพื่อนำเข้า</p></div>';
  const kind = dashKind, total = people.length;
  const answeredList = people.filter(p => currentAttempt(p.id, kind));
  const pendingList = people.filter(p => !currentAttempt(p.id, kind));
  const cur_ = answeredList.map(p => currentAttempt(p.id, kind));
  const avg = cur_.length ? cur_.reduce((s, a) => s + a.score, 0) / cur_.length : 0;
  const qn = cur_.length ? cur_[0].total : questions.length;
  const failList = kind === 'post' ? answeredList.filter(p => !currentAttempt(p.id, 'post').passed) : [];
  const passN = cur_.filter(a => a.passed).length;

  let h = `<div class="card"><div class="row" style="justify-content:space-between">
      <div class="row"><button class="btn ${kind === 'pre' ? '' : 'ghost'}" onclick="setKind('pre')">Pre-test</button><button class="btn ${kind === 'post' ? '' : 'ghost'}" onclick="setKind('post')">Post-test</button></div>
      <button class="btn green" onclick="exportExcel()">⬇ Export Excel</button></div>
    <div class="stats">
      <div class="stat"><div class="n">${answeredList.length}/${total}</div><div class="l">ตอบแล้ว</div></div>
      <div class="stat"><div class="n">${cur_.length ? avg.toFixed(2) : '—'}</div><div class="l">คะแนนเฉลี่ย (เต็ม ${qn}) ${cur_.length && qn ? '· ' + (avg / qn * 100).toFixed(1) + '%' : ''}</div></div>
      <div class="stat click" onclick="openPending=!openPending;renderTab()"><div class="n">${pendingList.length}</div><div class="l">ยังไม่ตอบ (กดดูรายชื่อ)</div></div>`;
  if(kind === 'post'){
    h += `<div class="stat"><div class="n" style="color:var(--green)">${passN}</div><div class="l">ผ่านเกณฑ์ ${cur.pass_percent}%</div></div>
      <div class="stat click" onclick="openFail=!openFail;renderTab()"><div class="n" style="color:var(--red)">${failList.length}</div><div class="l">ไม่ผ่าน (กดดู/ปลดล็อก)</div></div>`;
  }
  h += '</div>';
  if(openPending){
    h += `<h3>ยังไม่ตอบ (${pendingList.length})</h3>` + (pendingList.length ? '<div>' + pendingList.map(p => {
      const u = lastUnlocked(p.id, kind);
      return `<span class="tag ${u ? 'wait' : 'gray'}" style="margin:2px">${esc(p.full_name)}${u ? ' (รอทำใหม่)' : ''}</span>`;
    }).join('') + '</div>' : '<p class="muted">ตอบครบทุกคนแล้ว 🎉</p>');
  }
  if(kind === 'post' && openFail){
    h += `<h3 style="margin-top:12px">ไม่ผ่านเกณฑ์ (${failList.length})</h3>` + (failList.length ? `<table><thead><tr><th>ชื่อ</th><th>คะแนน</th><th>ครั้งที่</th><th></th></tr></thead><tbody>` +
      failList.map(p => { const a = currentAttempt(p.id, 'post'); return `<tr><td>${esc(p.full_name)}</td><td>${a.score}/${a.total}</td><td>${attemptCount(p.id, 'post')}</td>
        <td class="row"><button class="btn ghost sm" onclick="showAttempt('${a.id}')">ดูข้อที่ผิด</button><button class="btn red sm" onclick="unlock('${a.id}')">ปลดล็อกให้ทำใหม่</button></td></tr>`; }).join('') + '</tbody></table>' : '<p class="muted">ไม่มีผู้ไม่ผ่าน</p>');
  }
  h += '</div>';

  h += `<div class="card"><h3>ผลรายคน</h3><div style="overflow:auto"><table><thead><tr><th>รหัส</th><th>ชื่อ-นามสกุล</th><th>สังกัด</th><th>Pre</th><th>Post</th><th>ส่งล่าสุด</th><th></th></tr></thead><tbody>` +
    people.map(p => {
      const pre = currentAttempt(p.id, 'pre'), post = currentAttempt(p.id, 'post');
      const latest = [pre, post].filter(Boolean).sort((a, b) => b.submitted_at.localeCompare(a.submitted_at))[0];
      let act = '';
      if(pre) act += `<button class="btn ghost sm" onclick="showAttempt('${pre.id}')">ดู Pre</button> `;
      if(post) act += `<button class="btn ghost sm" onclick="showAttempt('${post.id}')">ดู Post</button> ` + (!post.passed ? `<button class="btn red sm" onclick="unlock('${post.id}')">ปลดล็อก Post</button>` : '');
      return `<tr><td>${esc(p.emp_id)}</td><td>${esc(p.full_name)}</td><td>${esc(p.unit)}</td><td>${scoreCell(p.id, 'pre')}</td><td>${scoreCell(p.id, 'post')}</td><td>${latest ? fmtT(latest.submitted_at) : ''}</td><td>${act}</td></tr>`;
    }).join('') + '</tbody></table></div></div>';
  return h;
}
function setKind(k){ dashKind = k; renderTab(); }

async function unlock(aid){
  const a = attempts.find(x => x.id === aid); if(!a) return;
  const p = people.find(x => x.id === a.participant_id);
  if(!confirm(`ปลดล็อก ${a.kind === 'pre' ? 'Pre-test' : 'Post-test'} ของ ${p ? p.full_name : ''} ให้ทำใหม่?\n(ผลครั้งเดิมยังเก็บไว้)`)) return;

function wrongRows(a){
  return questions.map((q, i) => {
    const chosen = a.answers ? a.answers[q.id] : undefined;

    const ok = chosen !== undefined && Number(chosen) === ci;
    return { i, q, chosen, ci, ok };
  });
}
function showAttempt(aid){

function questionForm(){

    [0, 1, 2, 3, 4].map(k => `<div class="row" style="margin-bottom:6px;flex-wrap:nowrap"><input type="radio" name="qf_c" value="${k}" ${ck === k ? 'checked' : ''}><b style="width:20px">${LETTERS[k]}</b><input type="text" id="qf_o${k}" value="${esc(opts[k] || '')}"></div>`).join('') +

async function saveQuestion(){
  const text = $('qf_q').value.trim();
  const opts = [0, 1, 2, 3, 4].map(k => $('qf_o' + k).value.trim());
  if(!text){ toast('กรุณาใส่โจทย์'); return; }
  if(opts.slice(0, 4).some(o => !o)){ toast('ตัวเลือก ก–ง ต้องไม่ว่าง'); return; }
  const options = opts[4] ? opts : opts.slice(0, 4);
  const sel = document.querySelector('input[name=qf_c]:checked');
  const ci = sel ? parseInt(sel.value) : -1;
  if(ci < 0 || ci >= options.length){ toast('กรุณาเลือกข้อที่ถูกต้อง (ในตัวเลือกที่มี)'); return; }
  if(editingQ === 'new'){
    if(questions.length >= MAX_Q){ toast('ครบ ' + MAX_Q + ' ข้อแล้ว'); return; }
    const id = crypto.randomUUID(), pos = questions.length ? Math.max(...questions.map(q => q.position)) + 1 : 1;
    let r = await sb.from('exam_questions').insert({ id, session_id: cur.id, position: pos, question: text, options });
    if(r.error){ toast('ผิดพลาด: ' + r.error.message); return; }
    r = await sb.from('exam_answer_keys').insert({ question_id: id, correct_index: ci });
    if(r.error){ toast('ผิดพลาด: ' + r.error.message); return; }
  } else {
    let r = await sb.from('exam_questions').update({ question: text, options }).eq('id', editingQ);
    if(r.error){ toast('ผิดพลาด: ' + r.error.message); return; }
    r = await sb.from('exam_answer_keys').upsert({ question_id: editingQ, correct_index: ci });
    if(r.error){ toast('ผิดพลาด: ' + r.error.message); return; }
  }
  editingQ = null; toast('บันทึกแล้ว'); await loadAll(); renderTab();
}
async function delQ(id){
  if(!confirm('ลบข้อสอบข้อนี้?')) return;
  const { error } = await sb.from('exam_questions').delete().eq('id', id);
  if(error){ toast('ผิดพลาด: ' + error.message); return; }

async function moveQ(i, d){
  const a = questions[i], b = questions[i + d]; if(!a || !b) return;
  await sb.from('exam_questions').update({ position: b.position }).eq('id', a.id);

  await loadAll(); renderTab();
}

/* ===== นำเข้าไฟล์ ===== */
function readSheet(file){
  return new Promise((res, rej) => {
    const fr = new FileReader(), csv = /\.csv$/i.test(file.name);
    fr.onload = () => { try {
      const wb = XLSX.read(fr.result, { type: csv ? 'string' : 'array' });
      res(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: '' }));
    } catch(e){ rej(e); } };
    fr.onerror = rej;
    csv ? fr.readAsText(file, 'utf-8') : fr.readAsArrayBuffer(file);
  });
}
const ANS_MAP = { 'ก':0,'ข':1,'ค':2,'ง':3,'จ':4,'a':0,'b':1,'c':2,'d':3,'e':4,'1':0,'2':1,'3':2,'4':3,'5':4 };
async function importQuestions(inp){
  const file = inp.files[0]; inp.value = ''; if(!file) return;
  let rows;
  try { rows = await readSheet(file); } catch(e){ toast('อ่านไฟล์ไม่สำเร็จ'); return; }
  rows = rows.filter(r => r.some(c => String(c).trim() !== ''));
  if(rows.length && String(rows[0][0]).includes('โจทย์')) rows.shift();
  const out = [], errs = [];
  rows.forEach((r, i) => {
    const text = String(r[0]).trim(), o = [1, 2, 3, 4, 5].map(k => String(r[k] ?? '').trim());
    const ans = ANS_MAP[String(r[6] ?? '').trim().toLowerCase()];
    const n = i + 1;
    if(!text) return errs.push(`แถว ${n}: ไม่มีโจทย์`);
    if(o.slice(0, 4).some(x => !x)) return errs.push(`แถว ${n}: ตัวเลือก ก–ง ต้องไม่ว่าง`);
    const options = o[4] ? o : o.slice(0, 4);
    if(ans === undefined || ans >= options.length) return errs.push(`แถว ${n}: เฉลยไม่ถูกต้อง`);
    out.push({ text, options, ans });
  });
  if(questions.length + out.length > MAX_Q) errs.push(`รวมแล้วเกิน ${MAX_Q} ข้อ (มีอยู่ ${questions.length} + นำเข้า ${out.length})`);
  if(!out.length && !errs.length) errs.push('ไม่พบข้อมูลในไฟล์');
  if(errs.length){ alert('นำเข้าไม่สำเร็จ ยังไม่มีอะไรถูกบันทึก:\n\n' + errs.slice(0, 15).join('\n')); return; }
  if(!confirm(`นำเข้า ${out.length} ข้อ ต่อท้ายข้อสอบเดิม ${questions.length} ข้อ?`)) return;
  let pos = questions.length ? Math.max(...questions.map(q => q.position)) : 0;
  const qrows = out.map(x => ({ id: crypto.randomUUID(), session_id: cur.id, position: ++pos, question: x.text, options: x.options }));
  let r = await sb.from('exam_questions').insert(qrows);
  if(r.error){ toast('ผิดพลาด: ' + r.error.message); return; }
  r = await sb.from('exam_answer_keys').insert(qrows.map((q, i) => ({ question_id: q.id, correct_index: out[i].ans })));
  if(r.error){ toast('ผิดพลาด (เฉลย): ' + r.error.message); return; }
  toast('นำเข้า ' + out.length + ' ข้อแล้ว'); await loadAll(); renderTab();
}
function downloadTemplate(kind){
  const aoa = kind === 'q'
    ? [['โจทย์','ก','ข','ค','ง','จ','เฉลย'], ['ตัวอย่าง: 1 + 1 เท่ากับเท่าใด','1','2','3','4','','ข']]
    : [['รหัสพนักงาน','ชื่อ-นามสกุล','ตำแหน่ง','สังกัด'], ['123456','นายสมชาย ใจดี','นักวิชาการ','กปภ.สาขาตัวอย่าง']];
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa), 'Sheet1');
  XLSX.writeFile(wb, kind === 'q' ? 'ตัวอย่าง_ข้อสอบ.xlsx' : 'ตัวอย่าง_รายชื่อ.xlsx');
}

  const title = $('s_title').value.trim(); if(!title){ toast('ต้องมีชื่อหลักสูตร'); return; }
  const { error } = await sb.from('exam_sessions').update({ title, course_no: $('s_no').value.trim(), batch: $('s_batch').value.trim(),
    pass_percent: Math.min(100, Math.max(1, parseInt($('s_pass').value) || 80)), shuffle_questions: $('s_sq').checked, shuffle_options: $('s_so').checked }).eq('id', cur.id);
  if(error){ toast('ผิดพลาด: ' + error.message); return; }
  toast('บันทึกแล้ว'); await loadAll(); renderDetail();
}
async function resetResults(){
  if(!confirm('ล้างผลสอบ (Pre/Post) ของทุกคนในแบบทดสอบนี้? ย้อนกลับไม่ได้')) return;
  if(!confirm('ยืนยันอีกครั้ง: ผลสอบทั้งหมดจะหายถาวร')) return;
  const { error } = await sb.from('exam_attempts').delete().eq('session_id', cur.id);
  if(error){ toast('ผิดพลาด: ' + error.message); return; }
  toast('ล้างผลสอบแล้ว'); await loadAll(); renderTab();
}
async function deleteSession(){
  if(!confirm('ลบแบบทดสอบนี้ พร้อมข้อสอบ รายชื่อ และผลสอบทั้งหมด? ย้อนกลับไม่ได้')) return;
  const id = cur.id;
  const { error } = await sb.from('exam_sessions').delete().eq('id', id);
  if(error){ toast('ผิดพลาด: ' + error.message); return; }
  toast('ลบแล้ว'); viewSessions();
}

boot();
</script>
</body>
